# Task is a convenience, not a project dependency: every task wraps a `uv run`
# command that can be executed by hand with an identical result.
version: '3'

tasks:
  setup:
    desc: Sync the environment with UV and install the pre-commit hooks.
    cmds:
      - uv sync --dev
      - uv run pre-commit install

  lint:
    desc: Run ruff in lint mode and check formatting.
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  typecheck:
    desc: Static type analysis with mypy over src/.
    cmds:
      - uv run mypy src/

  test:
    desc: Test suite with coverage.
    cmds:
      - uv run pytest -v

  check:
    desc: Lint, types and tests in sequence. Mirrors what CI runs.
    cmds:
      - task: lint
      - task: typecheck
      - task: test
