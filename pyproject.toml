[project]
name = "credit-risk-copilot"
version = "0.1.0"
description = "Credit risk scoring (probability of default) with an agentic copilot on top of the model."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# The base set is exactly what the MODEL service needs to serve a probability, an
# attribution and a counterfactual. It is not a taste judgement: `docker/Dockerfile.model`
# installs this list and nothing else, and the two-image split of ADR-0010 is what makes
# the boundary load-bearing. Anything added here is added to the model image.
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.4",
    "mlflow>=3.15.2",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "scikit-learn>=1.5",
    "shap>=0.51.0",
    "ucimlrepo>=0.0.7",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_copilot"]

# ---------------------------------------------------------------------------
# The three sets that are NOT in the model image
# ---------------------------------------------------------------------------
# Dependency groups (PEP 735) and not `optional-dependencies`, and the reason is a measured
# one rather than a preference. Extras are not installed by a bare `uv sync`, and this uv
# has no `default-extras` setting to change that - verified: after declaring them as extras,
# `uv sync` uninstalled the whole copilot stack and `uv run python scripts/...` would have
# broken every reproduction command `docs/EVALUATION.md` documents. Groups have
# `tool.uv.default-groups` below, so a developer's environment stays complete while each
# image installs exactly what it needs with `--no-default-groups`.
[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
]

# What the COPILOT needs on top of the base set, and nothing else needs at all. Measured on
# the development environment: torch 468 MB, chromadb 64 MB, transformers 52 MB, langgraph
# 7.6 MB, anthropic 7.3 MB, sentence-transformers 4.6 MB - about 604 MB that a request for
# `P(default)` would otherwise pay for and never call. `docker/Dockerfile.agent` installs
# this group; `docker/Dockerfile.model` installs none.
agent = [
    "anthropic>=1.2.0",
    "chromadb>=1.5.9",
    "langgraph>=1.2.11",
    "sentence-transformers>=6.0.0",
    # Declared even though `sentence-transformers` already requires it, and the reason is
    # mechanical rather than stylistic: `tool.uv.sources` only rewrites the index of a
    # **direct** dependency. Left transitive, the CPU-only index below is ignored in silence
    # and the CUDA wheels come back - which is exactly what happened on the first attempt.
    "torch>=2.0",
]

# What only the phase-2 measurement scripts import. Nothing under `src/` reaches for any of
# these, so neither image installs them; `scripts/run_tuning.py` and
# `scripts/run_imbalance_comparison.py` do. `lightgbm` is here because it is declared and
# **no module in this repository imports it** - see the turn report; removing it is a
# decision for the architect, not a move for the executor.
research = [
    "imbalanced-learn>=0.14.2",
    "lightgbm>=4.7.0",
    "optuna>=4.9.0",
]

[tool.uv]
# What a bare `uv sync` and every `uv run` install. All of them, so that a contributor gets a
# complete environment and the reproduction commands in `docs/EVALUATION.md` keep working.
# The images opt out with `--no-default-groups` and then name only what they need, which is
# what makes the split a property of the build rather than of somebody's memory.
default-groups = ["dev", "agent", "research"]

# ---------------------------------------------------------------------------
# `torch` resolves against the CPU-only wheel index
# ---------------------------------------------------------------------------
# **Why.** On Linux the default PyPI wheel of `torch` declares a dependency on the CUDA
# runtime, and the lockfile showed it pulling **19 packages** - `nvidia-cublas`,
# `nvidia-cudnn-cu13`, `nvidia-nccl-cu13`, `triton` and the rest - all marked
# `sys_platform == 'linux'`. They never appeared on the development machine, which is
# Windows, so the cost was invisible until the image was resolved for Linux.
#
# **Nothing in this system uses a GPU.** `torch` is here only because
# `sentence-transformers` needs it to embed a query, and that embedding runs on CPU. The
# CUDA runtime was being installed to never be called.
#
# `explicit = true` means this index is used **only** for the packages that name it below.
# Without it, uv would prefer this index for every package it happens to host, which is a
# quiet way to start resolving unrelated dependencies from a mirror nobody audited.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "D",    # pydocstyle
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib: paths via pathlib, never strings
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/credit_copilot --cov-report=term-missing"
